name: Production update monitor

# Confirms the 06:15/11:15/16:15/22:15 Europe/London EasyCron-triggered
# production updates actually ran (see docs/INFRASTRUCTURE.md). Runs on
# GitHub-hosted runners because prices.fly.dev is not reachable from Claude's
# cloud agent environment.
#
# GitHub Actions schedules on low-activity repos are best-effort: the
# previous version of this schedule targeted 8 fixed daily ticks but was
# observed (see issue #121) actually firing only ~4/day, at times unrelated
# to the configured minute/hour — every single run since that fix landed
# fired outside its intended window and no-opped. So this workflow no longer
# tries to land inside narrow windows around each expected run. It fires
# hourly (GitHub throttles that down on its own regardless), and
# bin/check_prod_update.py checks, whenever it happens to run, that the
# latest forecast is no older than the most recent expected run that has
# already passed - so it catches a missed update regardless of exactly when
# GitHub decides to execute the job.
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check production forecast update ran
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bin/check_prod_update.py
