name: Production update monitor

# Confirms the 06:15/11:15/16:15/22:15 Europe/London EasyCron-triggered
# production updates actually ran (see docs/INFRASTRUCTURE.md). Runs on
# GitHub-hosted runners because prices.fly.dev is not reachable from Claude's
# cloud agent environment.
#
# One fixed tick per expected run per possible UTC offset (BST/GMT) — 8/day,
# each 35 minutes after the run, at :50 rather than a round minute.
# bin/check_prod_update.py uses the real Europe/London clock to no-op for
# whichever offset isn't currently in effect, so this needs no seasonal
# adjustment. An earlier version fired every 15 minutes across broad hour
# windows (~48 ticks/day) to cover the same DST uncertainty with a wide
# buffer; GitHub Actions throttled that down to ~5 runs/day at essentially
# arbitrary times (confirmed via the runs list — see PR history), which
# silently skipped most of the real check windows. Scheduled workflows are
# known to be delayed or dropped under load, worst at the top of the hour;
# this schedule stays far below whatever threshold triggered that, and off
# the crowded minutes.
on:
  schedule:
    - cron: "50 5,6,10,11,15,16,21,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check production forecast update ran
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bin/check_prod_update.py
