# fly.toml app configuration file generated for prices on 2025-04-01T20:57:01+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'prices'
primary_region = 'lhr'
console_command = '/code/manage.py shell'

[build]

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'

[processes]
  # nginx on :8000 buffering in front of gunicorn on a unix socket. The
  # gunicorn flags live in the entrypoint so they are defined once.
  web = '/code/deploy/web-entrypoint.sh'
  worker = 'python manage.py update_worker'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  # Tell Fly how much this machine can actually take. Without this the proxy
  # has no concurrency limit, so it keeps sending connections to a machine that
  # can only serve `--workers` requests at once. The excess piles into the
  # kernel backlog, clients give up (57 sockets observed in CLOSE_WAIT), and the
  # health check cannot get a worker either — so a capacity limit became a total
  # outage. soft_limit ~= worker count makes Fly spread load to the other
  # machine; hard_limit caps the queue so excess fails fast instead of rotting.
  #
  # Deliberately UNCHANGED by the nginx proxy deploy. soft_limit = 4 describes
  # gunicorn's capacity, not nginx's, so it is now wrong — but retuning it at
  # the same time as the proxy would confound the one measurement that tells us
  # whether the proxy worked. Retune after observing nginx-backed behaviour.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 4
    hard_limit = 40

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    timeout = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
