# nginx.conf — buffering reverse proxy in front of gunicorn.
#
# Why this exists: gunicorn sync workers do no response buffering, so a worker
# is held for the whole connection lifetime, including writing the response
# back to the client. With --workers 4 across two machines that is eight
# concurrent requests for the entire service, and eight clients that stop
# reading take the site down — observed 2026-08-16, a four-hour outage that
# twenty-four watchdog restarts could not clear.
#
# nginx absorbs slow clients on its event loop and releases the gunicorn worker
# as soon as the response is buffered. See docs/PRODUCTION_PERFORMANCE_FINDINGS.md.

# Everything in this container already runs as root, and this removes any
# chance of a socket-permission failure on the gunicorn unix socket.
user root;

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile   on;
    tcp_nopush on;
    server_tokens off;

    # Buffering moves the slow-client problem here by design. These stop it
    # becoming an unbounded queue: nginx evicts slow clients rather than
    # accumulating them.
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  4m;

    # Log only requests taking >= 1s, with upstream time next to total time.
    # That difference is precisely what distinguishes "the app was slow" from
    # "the client was slow to read" — the question we could not answer during
    # the 2026-08-16 outage because no such record existed.
    log_format slow '$remote_addr fly_ip=$http_fly_client_ip "$request" '
                    'status=$status bytes=$body_bytes_sent '
                    'request_time=$request_time upstream_time=$upstream_response_time';

    map $request_time $is_slow {
        default 1;
        ~^0\.   0;
    }

    access_log /dev/stdout slow if=$is_slow;

    # ---- Shedding scanner traffic before it reaches gunicorn -----------------
    #
    # 2026-08-31: ~4 hours of outages, 28% of uptime checks failing. Cause was a
    # single IP running a WordPress/Laravel exploit scan at 10-17 requests/second
    # across both machines. Every one was correctly denied — but by the Django
    # blocklist middleware, so each junk request still consumed a gunicorn worker
    # to produce its 403. With 4 sync workers on one shared vCPU that is enough to
    # saturate the box.
    #
    # This is the same shape as the auto-refresh overload removed on 2026-08-05:
    # the fix is to remove the load, not to add capacity. The Django blocklist
    # stays as defence in depth; this just stops the traffic much earlier and much
    # more cheaply.

    # The real client. Behind Fly's proxy $remote_addr is the proxy itself, so
    # rate limiting on it would lump every visitor into one bucket.
    map $http_fly_client_ip $client_ip {
        default $http_fly_client_ip;
        ""      $remote_addr;
    }

    # Paths this application has never served. Answered by nginx directly, so no
    # gunicorn worker is spent on them.
    #
    # 403 rather than 444, changed 2026-08-31 after observing the deploy. 444
    # closes without responding, which is the usual anti-scanner answer, but Fly's
    # proxy sits in front of nginx and renders a closed connection as a 502 plus an
    # error line of its own. At the 10-17 req/s this scanner sustained that is
    # 10-17 proxy errors a second, which would bury genuine errors in the log —
    # losing exactly the diagnosability that made this incident tractable. A 403 is
    # a completed response, so the proxy stays quiet, and it costs nginx the same
    # nothing.
    map $request_uri $is_exploit_probe {
        default                                                    0;
        ~*^/+(?:[^/]+/)?wp-(?:json|admin|content|includes|login)    1;
        ~*^/+(?:index|xmlrpc|wlwmanifest|shell|eval|config)\.php    1;
        ~*^/+livewire/                                              1;
        ~*^/+\.(?:env|git)                                          1;
        ~*^/+(?:vendor|autoload|phpunit)/                           1;
    }

    # An empty key disables the limit for that request, which is how the
    # endpoints that must never be throttled are exempted:
    #   /healthz  — Fly's health check, every 15s; throttling it fails the machine
    #   /update   — the EasyCron forecast trigger, which fires once and never
    #               retries, so a throttled POST silently loses a whole cycle
    #   /webhooks — Ko-fi payment callbacks
    map $request_uri $limit_key {
        default        $client_ip;
        ~^/healthz     "";
        ~^/update      "";
        ~^/webhooks/   "";
    }

    # 2 r/s sustained with a burst of 30 is far above any human browsing pattern
    # (a chart page load is a handful of requests) and far below the 10-17 r/s the
    # scanner sustained. Each machine keeps its own zone, so the effective ceiling
    # across the two is double these numbers.
    limit_req_zone  $limit_key zone=perip:10m rate=2r/s;
    limit_conn_zone $limit_key zone=connperip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Log rejections so the next incident can be measured rather than guessed at.
    limit_req_log_level warn;

    upstream django {
        server unix:/run/gunicorn.sock fail_timeout=0;
    }

    server {
        listen 8000 default_server;
        server_name _;

        location / {
            # Answered here, never proxied: no gunicorn worker is involved.
            if ($is_exploit_probe) {
                return 403;
            }

            # burst=30 nodelay: a legitimate burst is served immediately, and only
            # sustained excess is rejected. Without nodelay nginx would queue the
            # burst instead, holding connections open — the opposite of the point.
            limit_req  zone=perip burst=30 nodelay;
            limit_conn connperip 20;

            proxy_pass http://django;

            # Host must pass through unchanged: Django's ALLOWED_HOSTS checks
            # it. Fly-Client-IP (used by the rate limiter and blocklist) has no
            # underscores, so nginx forwards it untouched by default.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # The point of the whole exercise. Response buffering frees the
            # gunicorn worker as soon as nginx holds the response; request
            # buffering closes the matching slowloris on the request side,
            # which the direct-to-gunicorn deployment was equally open to.
            proxy_buffering         on;
            proxy_request_buffering on;

            # Measured response sizes: /v2/?days=14&gen=1 is 411 KB, /api/ is
            # 979 KB, /v2/stats/ is 2.6 MB. 2 MB of buffers keeps everything
            # but stats entirely in memory, and caps nginx at ~80 MB if all 40
            # slots allowed by hard_limit were simultaneously serving maxima.
            #
            # proxy_max_temp_file_size is deliberately NOT 0. Disabling temp
            # files does not avoid disk so much as avoid *buffering*: on a
            # response larger than the buffers nginx reverts to synchronous
            # streaming and holds the gunicorn worker for the whole slow-client
            # write — precisely the failure this proxy exists to remove. A
            # bounded overflow file instead lets nginx always drain gunicorn at
            # full speed and free the worker. This is not the Aug 4
            # FileBasedCache mistake, which was disk I/O on *every* request;
            # this is disk only in the rare oversized tail.
            proxy_buffer_size        64k;
            proxy_buffers            32 64k;
            proxy_busy_buffers_size  128k;
            proxy_max_temp_file_size 64m;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
