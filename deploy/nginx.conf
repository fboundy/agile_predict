# nginx.conf — buffering reverse proxy in front of gunicorn.
#
# Why this exists: gunicorn sync workers do no response buffering, so a worker
# is held for the whole connection lifetime, including writing the response
# back to the client. With --workers 4 across two machines that is eight
# concurrent requests for the entire service, and eight clients that stop
# reading take the site down — observed 2026-08-16, a four-hour outage that
# twenty-four watchdog restarts could not clear.
#
# nginx absorbs slow clients on its event loop and releases the gunicorn worker
# as soon as the response is buffered. See docs/PRODUCTION_PERFORMANCE_FINDINGS.md.

# Everything in this container already runs as root, and this removes any
# chance of a socket-permission failure on the gunicorn unix socket.
user root;

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile   on;
    tcp_nopush on;
    server_tokens off;

    # Buffering moves the slow-client problem here by design. These stop it
    # becoming an unbounded queue: nginx evicts slow clients rather than
    # accumulating them.
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  4m;

    # Log only requests taking >= 1s, with upstream time next to total time.
    # That difference is precisely what distinguishes "the app was slow" from
    # "the client was slow to read" — the question we could not answer during
    # the 2026-08-16 outage because no such record existed.
    log_format slow '$remote_addr fly_ip=$http_fly_client_ip "$request" '
                    'status=$status bytes=$body_bytes_sent '
                    'request_time=$request_time upstream_time=$upstream_response_time';

    map $request_time $is_slow {
        default 1;
        ~^0\.   0;
    }

    access_log /dev/stdout slow if=$is_slow;

    upstream django {
        server unix:/run/gunicorn.sock fail_timeout=0;
    }

    server {
        listen 8000 default_server;
        server_name _;

        location / {
            proxy_pass http://django;

            # Host must pass through unchanged: Django's ALLOWED_HOSTS checks
            # it. Fly-Client-IP (used by the rate limiter and blocklist) has no
            # underscores, so nginx forwards it untouched by default.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # The point of the whole exercise. Response buffering frees the
            # gunicorn worker as soon as nginx holds the response; request
            # buffering closes the matching slowloris on the request side,
            # which the direct-to-gunicorn deployment was equally open to.
            proxy_buffering         on;
            proxy_request_buffering on;

            # Measured response sizes: /v2/?days=14&gen=1 is 411 KB, /api/ is
            # 979 KB, /v2/stats/ is 2.6 MB. 2 MB of buffers keeps everything
            # but stats entirely in memory, and caps nginx at ~80 MB if all 40
            # slots allowed by hard_limit were simultaneously serving maxima.
            #
            # proxy_max_temp_file_size is deliberately NOT 0. Disabling temp
            # files does not avoid disk so much as avoid *buffering*: on a
            # response larger than the buffers nginx reverts to synchronous
            # streaming and holds the gunicorn worker for the whole slow-client
            # write — precisely the failure this proxy exists to remove. A
            # bounded overflow file instead lets nginx always drain gunicorn at
            # full speed and free the worker. This is not the Aug 4
            # FileBasedCache mistake, which was disk I/O on *every* request;
            # this is disk only in the rare oversized tail.
            proxy_buffer_size        64k;
            proxy_buffers            32 64k;
            proxy_busy_buffers_size  128k;
            proxy_max_temp_file_size 64m;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
